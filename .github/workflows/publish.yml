name: publish

# Pushes the STUDENT bundle to a separate PUBLIC repository, so that students
# get a stable URL and one-click Colab links without having access to this one.
#
# Setup, once:
#   1. create an empty public repo, e.g. <you>/pinns-m2-macia-students
#   2. here: Settings -> Secrets and variables -> Actions
#        variable  COURSE_PUBLIC_REPO = <you>/pinns-m2-macia-students
#        secret    COURSE_PUBLIC_TOKEN = a fine-grained PAT with
#                  "Contents: read and write" on that repository only
#
# Then every tag v* republishes. Nothing from this repository is copied except
# the contents of dist/, which `make release` builds from the student variants.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: apt-get update -qq && apt-get install -y -qq python3 git >/dev/null

      - name: Build the student bundle
        run: make release

      - name: Refuse to publish if anything leaked
        run: |
          for f in dist/*.pdf; do
            if pdftotext "$f" - | grep -qiE '^(Solutions|Expected results)'; then
              echo "::error file=$f::solutions in a file about to be made public"; exit 1
            fi
          done
          if ls dist/*-solutions.ipynb >/dev/null 2>&1; then
            echo "::error::a solutions notebook reached dist/"; exit 1
          fi
          echo "bundle is clean"

      - name: Push to the public repository
        env:
          TOKEN: ${{ secrets.COURSE_PUBLIC_TOKEN }}
          PUBLIC: ${{ vars.COURSE_PUBLIC_REPO }}
        run: |
          test -n "$PUBLIC" || { echo "::error::set the variable COURSE_PUBLIC_REPO"; exit 1; }
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${PUBLIC}.git" public
          rm -rf public/materials && mkdir -p public/materials
          cp dist/* public/materials/
          sed "s|<PUBLIC_REPO>|${PUBLIC}|g" docs/README-public.md > public/README.md
          cd public
          git config user.name  "course publisher"
          git config user.email "noreply@github.com"
          git add -A
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "Materials for ${GITHUB_REF_NAME}"
          git push
