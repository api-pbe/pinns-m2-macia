name: build

# Public repository. On every push both variants must compile and the committed
# notebooks must match their generator. On a tag v*, everything is attached to a
# release, which gives each document a permanent URL of the form
#   https://github.com/<owner>/<repo>/releases/latest/download/session-01-notes.pdf

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: apt-get update -qq && apt-get install -y -qq python3 >/dev/null

      - name: Build every document, both variants
        run: make all handout

      - name: A handout must not contain solutions
        run: |
          for f in session-[0-9]*/*-handout.pdf; do
            if pdftotext "$f" - | grep -qiE '^(Solutions|Expected results)'; then
              echo "::error file=$f::solutions survived in a handout"; exit 1
            fi
          done
          echo "handouts are clean"

      - name: Committed notebooks must match their generator
        run: |
          # actions/checkout records safe.directory on the runner, not in this
          # container, so git diff here can exit "not a git repository" without
          # comparing anything. Fall back to a byte compare in that case.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}" || true
          snapshot() {
            find session-[0-9]* -name '*.ipynb' -type f | sort | xargs sha256sum
          }
          before=$(snapshot)
          make notebooks
          if git rev-parse --is-inside-work-tree >/dev/null 2>/tmp/git-err; then
            if ! git diff --quiet -- '*.ipynb'; then
              echo "::error::a committed notebook differs from build_notebooks.py output"
              git diff --stat -- '*.ipynb'
              exit 1
            fi
          else
            echo "git metadata is not usable in the job container; comparing notebook bytes"
            cat /tmp/git-err
            after=$(snapshot)
            if [ "$before" != "$after" ]; then
              echo "::error::a committed notebook differs from build_notebooks.py output"
              printf '%s\n' "$before" "$after"
              exit 1
            fi
          fi
          echo "notebooks are up to date"

      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: session-[0-9]*/*.pdf
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the bundle
        uses: addnab/docker-run-action@v3
        with:
          image: texlive/texlive:latest
          options: -v ${{ github.workspace }}:/w -w /w
          run: |
            apt-get update -qq && apt-get install -y -qq python3 >/dev/null
            make release

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Each document comes in two forms:

            * `session-NN-*.pdf` — complete, with solutions
            * `session-NN-*-handout.pdf` — the version to print for the session

            Lab notebooks are included; they also open directly in Colab from the
            repository.
